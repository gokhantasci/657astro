# Include inside 657.com.tr HTTPS server; WordPress files/routes are unchanged.
location = /_657-servis {
    return 308 /_657-servis/;
}
location ^~ /_657-servis/ {
    client_max_body_size 16k;
    proxy_pass http://127.0.0.1:4326/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Prefix /_657-servis;
    proxy_connect_timeout 3s;
    proxy_read_timeout 90s;
    proxy_cache off;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
location ^~ /dosyalar/uygulamalar/ {
    alias /opt/657-dosyalar/uygulamalar/;
    autoindex off;
    default_type application/octet-stream;
    add_header Content-Disposition "attachment" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex" always;
}
location ^~ /modeller/ {
    alias /opt/657-modeller/;
    autoindex off;
    types { application/wasm wasm; application/json json; }
    default_type application/octet-stream;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "public, max-age=3600";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex" always;
}
