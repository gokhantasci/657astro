# Derleme ve GitHub Pages yayını. Her saat başı kurum haberlerini (scripts/haberler.mjs) ve
# yayından sonraki okunma sayılarını (scripts/okunma.mjs) yeniler, siteyi derleyip yayımlar.
# Değişen veri dosyaları (haberler, okunma, maaş/vergi arşivleri) depoya geri yazılır.
name: Derle ve yayımla

on:
  push:
    branches: [main]
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: yayin
  cancel-in-progress: false

jobs:
  derle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Öneri servisinin kontrolleri
        run: |
          python -m pip install -r services/oneriler/requirements.txt reportlab==5.1.0
          cd services/oneriler
          python -m unittest -v test_app
      - name: Kurum haberleri
        run: node scripts/haberler.mjs
        continue-on-error: true
      - name: Okunma sayıları (GA4)
        run: node scripts/okunma.mjs
        continue-on-error: true
        env:
          GA_HIZMET_HESABI: ${{ secrets.GA_HIZMET_HESABI }}
          GA_MULK: ${{ vars.GA_MULK }}
          PUBLIC_OKUNMA_API: ${{ vars.PUBLIC_OKUNMA_API }}
      # Döviz, hava ve akaryakıt ziyaretçiye kendi alan adımızdan sunulur.
      - name: Döviz, hava durumu ve Shell fiyatları
        run: node scripts/gundem-guncelle.mjs
        continue-on-error: true
      - name: HSK yargı çevresi duyurularını izle
        run: node scripts/hsk-yargi-cevresi.mjs
        continue-on-error: true
      - name: Derleme
        run: npm run build
        env:
          TZ: Europe/Istanbul
          # Ana alan adı (public/CNAME = 657.com.tr) kökten yayınlanır.
          BASE_PATH: /
          PUBLIC_ONERI_API: ${{ vars.PUBLIC_ONERI_API }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
          PUBLIC_ASISTAN_MODEL_ORIGIN: https://657.com.tr
          PUBLIC_OKUNMA_API: ${{ vars.PUBLIC_OKUNMA_API }}
      - name: Veri değişikliklerini kaydet
        run: |
          git config user.name "657 yayın"
          git config user.email "gokhan@657.com.tr"
          git add src/data/arac-kullanim-sirasi.json src/data/haberler.json src/data/haber-akisi.json src/data/gundem.json src/data/hsk-yargi-cevresi-izleme.json src/data/okunma.json src/data/maas-arsivleri src/data/vergi-arsivleri src/data/enflasyon-arsivi.json src/content/yazilar/*enflasyon-verileri.md src/content/yazilar/*enflasyon-ozeti.md
          git diff --cached --quiet || git commit -m "Veri güncellemesi: haberler ve arşivler [skip ci]"
          git push || echo "Veri gönderilemedi; bir sonraki çalışmada yeniden denenecek."
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  yayimla:
    needs: derle
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dagit.outputs.page_url }}
    steps:
      - id: dagit
        uses: actions/deploy-pages@v4
        timeout-minutes: 35
        with:
          # Büyük üretim paketinde Pages dosya eşitlemesi 10 dakikayı aşabilir.
          timeout: 1800000
      # Cloudflare önbelleği yeni sürüm için temizlenir. Secret'lar tanımlı değilse adım atlanır.
      - name: Cloudflare önbelleğini temizle
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ZONE" ]; then echo "Cloudflare secret'ları yok; önbellek temizlenmedi."; exit 0; fi
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/purge_cache" -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" --data '{"purge_everything":true}' > /dev/null
          echo "Önbellek temizlendi."
